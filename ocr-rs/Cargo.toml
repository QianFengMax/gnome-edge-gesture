[package]
name = "edgegesture-ocr"
version = "1.0.0"
edition = "2021"
description = "Rust OCR for Edge Gesture (PP-OCRv3 via ONNX Runtime)"

[[bin]]
name = "edgegesture-ocr"
path = "src/main.rs"

[dependencies]
ort = { version = "2.0.0-rc.4", features = ["download-binaries"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
